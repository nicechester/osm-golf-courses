name: Extract Golf Courses

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        region:
          - us/alabama
          - us/alaska
          - us/arizona
          - us/arkansas
          - us/california
          - us/colorado
          - us/connecticut
          - us/delaware
          - us/district-of-columbia
          - us/florida
          - us/georgia
          - us/hawaii
          - us/idaho
          - us/illinois
          - us/indiana
          - us/iowa
          - us/kansas
          - us/kentucky
          - us/louisiana
          - us/maine
          - us/maryland
          - us/massachusetts
          - us/michigan
          - us/minnesota
          - us/mississippi
          - us/missouri
          - us/montana
          - us/nebraska
          - us/nevada
          - us/new-hampshire
          - us/new-jersey
          - us/new-mexico
          - us/new-york
          - us/north-carolina
          - us/north-dakota
          - us/ohio
          - us/oklahoma
          - us/oregon
          - us/pennsylvania
          - us/puerto-rico
          - us/rhode-island
          - us/south-carolina
          - us/south-dakota
          - us/tennessee
          - us/texas
          - us/utah
          - us/vermont
          - us/virginia
          - us/washington
          - us/west-virginia
          - us/wisconsin
          - us/wyoming
          - canada/alberta
          - canada/british-columbia
          - canada/manitoba
          - canada/new-brunswick
          - canada/newfoundland-and-labrador
          - canada/northwest-territories
          - canada/nova-scotia
          - canada/nunavut
          - canada/ontario
          - canada/prince-edward-island
          - canada/quebec
          - canada/saskatchewan
          - canada/yukon
          - mexico

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y osmium-tool jq bc

      - name: Extract courses for ${{ matrix.region }}
        run: |
          region="${{ matrix.region }}"
          
          # Determine URL and paths
          if [[ "$region" == "mexico" ]]; then
            url="https://download.geofabrik.de/north-america/mexico-latest.osm.pbf"
            continent="north-america"
            country="mx"
            state="mexico"
          elif [[ "$region" == us/* ]]; then
            state_slug="${region#us/}"
            url="https://download.geofabrik.de/north-america/us/${state_slug}-latest.osm.pbf"
            continent="north-america"
            country="us"
            state="$state_slug"
          elif [[ "$region" == canada/* ]]; then
            prov_slug="${region#canada/}"
            url="https://download.geofabrik.de/north-america/canada/${prov_slug}-latest.osm.pbf"
            continent="north-america"
            country="ca"
            state="$prov_slug"
          fi
          
          mkdir -p "courses/$continent/$country/$state"
          
          # Download
          curl -L -o region.osm.pbf "$url"
          
          # Extract golf courses
          osmium tags-filter region.osm.pbf \
            nwr/leisure=golf_course nwr/golf=hole nwr/golf=fairway nwr/golf=green nwr/golf=bunker nwr/golf=rough \
            -o golf.osm.pbf --overwrite
          
          # Export to GeoJSON
          osmium export golf.osm.pbf -o all.geojson --add-unique-id=type_id --overwrite
          
          # Extract each course (only Polygon/MultiPolygon)
          jq -c '.features[] | select(.properties.leisure == "golf_course" and .properties.name != null and (.geometry.type == "Polygon" or .geometry.type == "MultiPolygon"))' all.geojson | while read -r course; do
            osm_id=$(echo "$course" | jq -r '.id')
            name=$(echo "$course" | jq -r '.properties.name')
            filename=$(echo "$name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
            filename="${filename}-${osm_id}"
            geom_type=$(echo "$course" | jq -r '.geometry.type')
            
            # Get bounds based on geometry type
            if [[ "$geom_type" == "Polygon" ]]; then
              bounds=$(echo "$course" | jq -c '{
                minLat: ([.geometry.coordinates[0][] | .[1]] | min),
                maxLat: ([.geometry.coordinates[0][] | .[1]] | max),
                minLon: ([.geometry.coordinates[0][] | .[0]] | min),
                maxLon: ([.geometry.coordinates[0][] | .[0]] | max)
              }')
            else
              bounds=$(echo "$course" | jq -c '{
                minLat: ([.geometry.coordinates[][] | .[] | .[1]] | min),
                maxLat: ([.geometry.coordinates[][] | .[] | .[1]] | max),
                minLon: ([.geometry.coordinates[][] | .[] | .[0]] | min),
                maxLon: ([.geometry.coordinates[][] | .[] | .[0]] | max)
              }')
            fi
            
            minLat=$(echo "$bounds" | jq -r '.minLat')
            maxLat=$(echo "$bounds" | jq -r '.maxLat')
            minLon=$(echo "$bounds" | jq -r '.minLon')
            maxLon=$(echo "$bounds" | jq -r '.maxLon')
            
            [[ "$minLat" == "0" || "$minLat" == "null" ]] && continue
            
            # Pad bounds
            minLat=$(echo "$minLat - 0.005" | bc)
            maxLat=$(echo "$maxLat + 0.005" | bc)
            minLon=$(echo "$minLon - 0.005" | bc)
            maxLon=$(echo "$maxLon + 0.005" | bc)
            
            # Extract features in bounds
            jq --argjson minLat "$minLat" --argjson maxLat "$maxLat" --argjson minLon "$minLon" --argjson maxLon "$maxLon" '
              def get_coords:
                if .geometry.type == "Point" then [.geometry.coordinates]
                elif .geometry.type == "LineString" then .geometry.coordinates
                elif .geometry.type == "Polygon" then .geometry.coordinates | flatten(1)
                elif .geometry.type == "MultiPolygon" then .geometry.coordinates | flatten(2)
                else [] end;
              def in_bounds:
                (get_coords | map(.[1] >= $minLat and .[1] <= $maxLat and .[0] >= $minLon and .[0] <= $maxLon) | any) // false;
              { type: "FeatureCollection", features: [.features[] | select(in_bounds)] }
            ' all.geojson | gzip -9 > "courses/$continent/$country/$state/${filename}.geojson.gz"
            
            echo "  ${filename}.geojson.gz ($(ls -lh "courses/$continent/$country/$state/${filename}.geojson.gz" | awk '{print $5}'))"
          done
          
          # Build state index (only Polygon/MultiPolygon)
          jq -c '[.features[] | select(.properties.leisure == "golf_course" and .properties.name != null and (.geometry.type == "Polygon" or .geometry.type == "MultiPolygon")) | {
            name: .properties.name,
            city: (.properties["addr:city"] // ""),
            osmId: .id,
            file: ((.properties.name | ascii_downcase | gsub("[^a-z0-9]"; "-") | gsub("--+"; "-") | gsub("^-"; "") | gsub("-$"; "")) + "-" + .id + ".geojson.gz"),
            lat: (if .geometry.type == "Polygon" then (.geometry.coordinates[0] | map(.[1]) | add / length)
                  else (.geometry.coordinates | flatten(2) | map(.[1]) | add / length) end),
            lon: (if .geometry.type == "Polygon" then (.geometry.coordinates[0] | map(.[0]) | add / length)
                  else (.geometry.coordinates | flatten(2) | map(.[0]) | add / length) end)
          }] | sort_by(.name)' all.geojson > "courses/$continent/$country/$state/index.json"
          
          echo "State index: $(jq length "courses/$continent/$country/$state/index.json") courses"

      - name: Set artifact name
        id: artifact
        run: echo "name=courses-$(echo '${{ matrix.region }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: courses/
          retention-days: 1

  publish:
    needs: extract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: courses-*
          merge-multiple: true

      - name: Build hierarchical indexes
        run: |
          # Merge all artifacts
          mkdir -p courses
          cp -r artifacts/* courses/ 2>/dev/null || true
          
          # Country indexes
          for country_dir in courses/*/*/; do
            [ -d "$country_dir" ] || continue
            jq -s 'add // [] | sort_by(.name)' "$country_dir"/*/index.json > "$country_dir/index.json" 2>/dev/null || echo "[]" > "$country_dir/index.json"
            echo "Country $(basename "$country_dir"): $(jq length "$country_dir/index.json") courses"
          done
          
          # Continent indexes  
          for continent_dir in courses/*/; do
            [ -d "$continent_dir" ] || continue
            jq -s 'add // [] | sort_by(.name)' "$continent_dir"/*/index.json > "$continent_dir/index.json" 2>/dev/null || echo "[]" > "$continent_dir/index.json"
            echo "Continent $(basename "$continent_dir"): $(jq length "$continent_dir/index.json") courses"
          done
          
          # Root index
          jq -s 'add // [] | sort_by(.name)' courses/*/index.json > courses/index.json 2>/dev/null || echo "[]" > courses/index.json
          echo "Total: $(jq length courses/index.json) courses"

      - name: Commit indexes
        run: |
          mkdir -p indexes
          find courses -name 'index.json' -exec cp --parents {} indexes/ \;
          mv indexes/courses/* indexes/
          rm -rf indexes/courses
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indexes/
          git diff --staged --quiet || git commit -m "Update indexes $(date +%Y-%m-%d)"
          git push

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y%m%d)"
          
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          
          # Flatten course files for upload
          mkdir -p release_files
          find courses -name '*.geojson.gz' | while read f; do
            # Preserve path in filename: north-america_us_california_pebble-beach-w123.geojson.gz
            newname=$(echo "${f#courses/}" | tr '/' '_')
            cp "$f" "release_files/$newname"
          done
          
          echo "Total files: $(ls release_files | wc -l)"
          
          gh release create "$TAG" \
            --title "Golf Courses $(date +%Y-%m-%d)" \
            --notes "Per-course GeoJSON files. Filename format: continent_country_state_course-osmid.geojson.gz"
          
          # Upload in batches
          ls release_files | split -l 100 - batch_
          for batch in batch_*; do
            echo "Uploading batch $batch..."
            cd release_files && xargs -a "../$batch" gh release upload "$TAG" --clobber && cd ..
          done
