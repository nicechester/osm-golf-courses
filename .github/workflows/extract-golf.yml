name: Extract Golf Courses

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download all regions sequentially
        run: |
          mkdir -p pbf
          
          regions=(
            us/alabama us/alaska us/arizona us/arkansas us/california
            us/colorado us/connecticut us/delaware us/district-of-columbia us/florida
            us/georgia us/hawaii us/idaho us/illinois us/indiana
            us/iowa us/kansas us/kentucky us/louisiana us/maine
            us/maryland us/massachusetts us/michigan us/minnesota us/mississippi
            us/missouri us/montana us/nebraska us/nevada us/new-hampshire
            us/new-jersey us/new-mexico us/new-york us/north-carolina us/north-dakota
            us/ohio us/oklahoma us/oregon us/pennsylvania us/puerto-rico
            us/rhode-island us/south-carolina us/south-dakota us/tennessee us/texas
            us/utah us/vermont us/virginia us/washington us/west-virginia
            us/wisconsin us/wyoming
            canada/alberta canada/british-columbia canada/manitoba canada/new-brunswick
            canada/newfoundland-and-labrador canada/northwest-territories canada/nova-scotia
            canada/nunavut canada/ontario canada/prince-edward-island canada/quebec
            canada/saskatchewan canada/yukon
            mexico
          )
          
          for region in "${regions[@]}"; do
            echo "=== Downloading: $region ==="
            
            if [[ "$region" == "mexico" ]]; then
              url="https://download.geofabrik.de/north-america/mexico-latest.osm.pbf"
              outfile="pbf/mexico.osm.pbf"
            elif [[ "$region" == us/* ]]; then
              state="${region#us/}"
              url="https://download.geofabrik.de/north-america/us/${state}-latest.osm.pbf"
              outfile="pbf/us-${state}.osm.pbf"
            elif [[ "$region" == canada/* ]]; then
              prov="${region#canada/}"
              url="https://download.geofabrik.de/north-america/canada/${prov}-latest.osm.pbf"
              outfile="pbf/ca-${prov}.osm.pbf"
            fi
            
            for i in 1 2 3; do
              curl -L --retry 3 --retry-delay 5 -o "$outfile" "$url" && break
              echo "Retry $i..."
              sleep $((i * 5))
            done
            
            if [[ -f "$outfile" ]]; then
              echo "Downloaded: $(ls -lh "$outfile" | awk '{print $5}')"
            else
              echo "FAILED: $region"
            fi
          done
          
          echo ""
          echo "=== Download Summary ==="
          ls -lh pbf/

      - name: Upload PBF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pbf-files
          path: pbf/
          retention-days: 1

  process:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        region:
          - us/alabama
          - us/alaska
          - us/arizona
          - us/arkansas
          - us/california
          - us/colorado
          - us/connecticut
          - us/delaware
          - us/district-of-columbia
          - us/florida
          - us/georgia
          - us/hawaii
          - us/idaho
          - us/illinois
          - us/indiana
          - us/iowa
          - us/kansas
          - us/kentucky
          - us/louisiana
          - us/maine
          - us/maryland
          - us/massachusetts
          - us/michigan
          - us/minnesota
          - us/mississippi
          - us/missouri
          - us/montana
          - us/nebraska
          - us/nevada
          - us/new-hampshire
          - us/new-jersey
          - us/new-mexico
          - us/new-york
          - us/north-carolina
          - us/north-dakota
          - us/ohio
          - us/oklahoma
          - us/oregon
          - us/pennsylvania
          - us/puerto-rico
          - us/rhode-island
          - us/south-carolina
          - us/south-dakota
          - us/tennessee
          - us/texas
          - us/utah
          - us/vermont
          - us/virginia
          - us/washington
          - us/west-virginia
          - us/wisconsin
          - us/wyoming
          - canada/alberta
          - canada/british-columbia
          - canada/manitoba
          - canada/new-brunswick
          - canada/newfoundland-and-labrador
          - canada/northwest-territories
          - canada/nova-scotia
          - canada/nunavut
          - canada/ontario
          - canada/prince-edward-island
          - canada/quebec
          - canada/saskatchewan
          - canada/yukon
          - mexico

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y osmium-tool jq bc

      - name: Download PBF artifact
        uses: actions/download-artifact@v4
        with:
          name: pbf-files
          path: pbf/

      - name: Process and publish ${{ matrix.region }}
        run: |
          region="${{ matrix.region }}"
          TAG="v$(date +%Y%m%d)"
          
          # Determine paths
          if [[ "$region" == "mexico" ]]; then
            pbf_file="pbf/mexico.osm.pbf"
            continent="north-america"
            country="mx"
            state="mexico"
          elif [[ "$region" == us/* ]]; then
            state_slug="${region#us/}"
            pbf_file="pbf/us-${state_slug}.osm.pbf"
            continent="north-america"
            country="us"
            state="$state_slug"
          elif [[ "$region" == canada/* ]]; then
            prov_slug="${region#canada/}"
            pbf_file="pbf/ca-${prov_slug}.osm.pbf"
            continent="north-america"
            country="ca"
            state="$prov_slug"
          fi
          
          file_prefix="${continent}_${country}_${state}_"
          
          # Check if already in today's release
          gh release view "$TAG" 2>/dev/null || gh release create "$TAG" \
            --title "Golf Courses $(date +%Y-%m-%d)" \
            --notes "Per-course GeoJSON files"
          
          if gh release view "$TAG" --json assets -q ".assets[].name" | grep -q "^${file_prefix}"; then
            echo "Region $region already in release, skipping"
            exit 0
          fi
          
          # Check PBF exists
          if [[ ! -f "$pbf_file" ]]; then
            echo "PBF file not found: $pbf_file"
            exit 1
          fi
          
          echo "Processing $pbf_file..."
          
          # Extract golf features
          osmium tags-filter "$pbf_file" \
            nwr/leisure=golf_course nwr/golf=hole nwr/golf=fairway nwr/golf=green nwr/golf=bunker nwr/golf=rough \
            -o golf.osm.pbf --overwrite
          
          osmium export golf.osm.pbf -o all.geojson --add-unique-id=type_id --overwrite
          
          mkdir -p output
          
          # Extract each course
          jq -c '.features[] | select(.properties.leisure == "golf_course" and .properties.name != null and (.geometry.type == "Polygon" or .geometry.type == "MultiPolygon"))' all.geojson | while read -r course; do
            osm_id=$(echo "$course" | jq -r '.id')
            name=$(echo "$course" | jq -r '.properties.name')
            filename=$(echo "$name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
            filename="${file_prefix}${filename}-${osm_id}.geojson.gz"
            geom_type=$(echo "$course" | jq -r '.geometry.type')
            
            # Get bounds
            if [[ "$geom_type" == "Polygon" ]]; then
              bounds=$(echo "$course" | jq -c '{
                minLat: ([.geometry.coordinates[0][] | .[1]] | min),
                maxLat: ([.geometry.coordinates[0][] | .[1]] | max),
                minLon: ([.geometry.coordinates[0][] | .[0]] | min),
                maxLon: ([.geometry.coordinates[0][] | .[0]] | max)
              }')
            else
              bounds=$(echo "$course" | jq -c '{
                minLat: ([.geometry.coordinates[][] | .[] | .[1]] | min),
                maxLat: ([.geometry.coordinates[][] | .[] | .[1]] | max),
                minLon: ([.geometry.coordinates[][] | .[] | .[0]] | min),
                maxLon: ([.geometry.coordinates[][] | .[] | .[0]] | max)
              }')
            fi
            
            minLat=$(echo "$bounds" | jq -r '.minLat')
            maxLat=$(echo "$bounds" | jq -r '.maxLat')
            minLon=$(echo "$bounds" | jq -r '.minLon')
            maxLon=$(echo "$bounds" | jq -r '.maxLon')
            
            [[ "$minLat" == "null" ]] && continue
            
            minLat=$(echo "$minLat - 0.005" | bc)
            maxLat=$(echo "$maxLat + 0.005" | bc)
            minLon=$(echo "$minLon - 0.005" | bc)
            maxLon=$(echo "$maxLon + 0.005" | bc)
            
            jq --argjson minLat "$minLat" --argjson maxLat "$maxLat" --argjson minLon "$minLon" --argjson maxLon "$maxLon" '
              def get_coords:
                if .geometry.type == "Point" then [.geometry.coordinates]
                elif .geometry.type == "LineString" then .geometry.coordinates
                elif .geometry.type == "Polygon" then .geometry.coordinates | flatten(1)
                elif .geometry.type == "MultiPolygon" then .geometry.coordinates | flatten(2)
                else [] end;
              def in_bounds:
                (get_coords | map(.[1] >= $minLat and .[1] <= $maxLat and .[0] >= $minLon and .[0] <= $maxLon) | any) // false;
              { type: "FeatureCollection", features: [.features[] | select(in_bounds)] }
            ' all.geojson | gzip -9 > "output/$filename"
          done
          
          # Build index
          jq -c --arg prefix "$file_prefix" '[.features[] | select(.properties.leisure == "golf_course" and .properties.name != null and (.geometry.type == "Polygon" or .geometry.type == "MultiPolygon")) | {
            name: .properties.name,
            city: (.properties["addr:city"] // ""),
            osmId: .id,
            file: ($prefix + (.properties.name | ascii_downcase | gsub("[^a-z0-9]"; "-") | gsub("--+"; "-") | gsub("^-"; "") | gsub("-$"; "")) + "-" + .id + ".geojson.gz"),
            lat: (if .geometry.type == "Polygon" then (.geometry.coordinates[0] | map(.[1]) | add / length)
                  else (.geometry.coordinates | flatten(2) | map(.[1]) | add / length) end),
            lon: (if .geometry.type == "Polygon" then (.geometry.coordinates[0] | map(.[0]) | add / length)
                  else (.geometry.coordinates | flatten(2) | map(.[0]) | add / length) end)
          }] | sort_by(.name)' all.geojson > "output/${file_prefix}index.json"
          
          course_count=$(jq length "output/${file_prefix}index.json")
          echo "Extracted $course_count courses"
          
          # Upload to release
          if [[ "$course_count" -gt 0 ]]; then
            echo "Uploading to release..."
            find output -type f | xargs gh release upload "$TAG" --clobber
            echo "Done: $region ($course_count courses)"
          fi

  build-indexes:
    needs: process
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and commit indexes
        run: |
          TAG="v$(date +%Y%m%d)"
          
          mkdir -p indexes/north-america/us indexes/north-america/ca indexes/north-america/mx
          
          # Download all index files from release
          gh release download "$TAG" --pattern "*_index.json" --dir tmp_indexes || true
          
          # Organize indexes
          for f in tmp_indexes/*_index.json; do
            [[ -f "$f" ]] || continue
            name=$(basename "$f")
            continent=$(echo "$name" | cut -d_ -f1)
            country=$(echo "$name" | cut -d_ -f2)
            state=$(echo "$name" | cut -d_ -f3)
            mkdir -p "indexes/$continent/$country/$state"
            cp "$f" "indexes/$continent/$country/$state/index.json"
          done
          
          # Build hierarchy
          for country_dir in indexes/*/*/; do
            [[ -d "$country_dir" ]] || continue
            jq -s 'add // [] | sort_by(.name)' "$country_dir"/*/index.json > "$country_dir/index.json" 2>/dev/null || echo "[]" > "$country_dir/index.json"
            echo "$(basename "$country_dir"): $(jq length "$country_dir/index.json") courses"
          done
          
          for continent_dir in indexes/*/; do
            [[ -d "$continent_dir" ]] || continue
            jq -s 'add // [] | sort_by(.name)' "$continent_dir"/*/index.json > "$continent_dir/index.json" 2>/dev/null || echo "[]" > "$continent_dir/index.json"
          done
          
          jq -s 'add // [] | sort_by(.name)' indexes/*/index.json > indexes/index.json 2>/dev/null || echo "[]" > indexes/index.json
          echo "Total: $(jq length indexes/index.json) courses"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indexes/
          git diff --staged --quiet || git commit -m "Update indexes $(date +%Y-%m-%d)"
          git push
