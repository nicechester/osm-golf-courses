name: Extract Golf Courses

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool jq

      - name: Create directories
        run: mkdir -p raw courses

      - name: Extract golf courses from each region
        run: |
          while IFS= read -r region; do
            region=$(echo "$region" | xargs)
            [ -z "$region" ] && continue
            
            # Determine URL and paths
            if [[ "$region" == "mexico" ]]; then
              url="https://download.geofabrik.de/north-america/mexico-latest.osm.pbf"
              continent="north-america"
              country="mx"
              state="mexico"
            elif [[ "$region" == us/* ]]; then
              state_slug="${region#us/}"
              url="https://download.geofabrik.de/north-america/us/${state_slug}-latest.osm.pbf"
              continent="north-america"
              country="us"
              state="$state_slug"
            elif [[ "$region" == canada/* ]]; then
              prov_slug="${region#canada/}"
              url="https://download.geofabrik.de/north-america/canada/${prov_slug}-latest.osm.pbf"
              continent="north-america"
              country="ca"
              state="$prov_slug"
            fi
            
            echo "=== Processing $continent/$country/$state ==="
            
            # Download
            curl -L -o raw/region.osm.pbf "$url" || { echo "Failed to download $region"; continue; }
            
            # Extract golf courses
            osmium tags-filter raw/region.osm.pbf \
              nwr/leisure=golf_course nwr/golf=hole nwr/golf=fairway nwr/golf=green nwr/golf=bunker nwr/golf=rough \
              -o raw/golf.osm.pbf --overwrite
            
            # Export to GeoJSON with IDs
            osmium export raw/golf.osm.pbf -o raw/all.geojson --add-unique-id=type_id --overwrite
            
            # Create directory structure
            mkdir -p "courses/$continent/$country/$state"
            
            # Extract each course as separate file
            jq -c '.features[] | select(.properties.leisure == "golf_course" and .properties.name != null)' raw/all.geojson | while read -r course; do
              osm_id=$(echo "$course" | jq -r '.id')
              name=$(echo "$course" | jq -r '.properties.name')
              
              # Create safe filename
              filename=$(echo "$name" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
              filename="${filename}-${osm_id}"
              
              # Get course bounds
              bounds=$(echo "$course" | jq -c 'if .geometry.type == "Polygon" then
                  { minLat: ([.geometry.coordinates[0][][1]] | min), maxLat: ([.geometry.coordinates[0][][1]] | max),
                    minLon: ([.geometry.coordinates[0][][0]] | min), maxLon: ([.geometry.coordinates[0][][0]] | max) }
                elif .geometry.type == "MultiPolygon" then
                  { minLat: ([.geometry.coordinates[][][]][0] | map(.[1]) | min), maxLat: ([.geometry.coordinates[][][]][0] | map(.[1]) | max),
                    minLon: ([.geometry.coordinates[][][]][0] | map(.[0]) | min), maxLon: ([.geometry.coordinates[][][]][0] | map(.[0]) | max) }
                else
                  { minLat: 0, maxLat: 0, minLon: 0, maxLon: 0 }
                end')
              
              minLat=$(echo "$bounds" | jq -r '.minLat')
              maxLat=$(echo "$bounds" | jq -r '.maxLat')
              minLon=$(echo "$bounds" | jq -r '.minLon')
              maxLon=$(echo "$bounds" | jq -r '.maxLon')
              
              # Skip if no valid bounds
              if [[ "$minLat" == "0" || "$minLat" == "null" ]]; then
                echo "  Skipping $name - no valid bounds"
                continue
              fi
              
              # Pad bounds slightly
              minLat=$(echo "$minLat - 0.005" | bc)
              maxLat=$(echo "$maxLat + 0.005" | bc)
              minLon=$(echo "$minLon - 0.005" | bc)
              maxLon=$(echo "$maxLon + 0.005" | bc)
              
              # Extract all features within course bounds (course + holes + geometry)
              jq --argjson minLat "$minLat" --argjson maxLat "$maxLat" --argjson minLon "$minLon" --argjson maxLon "$maxLon" '
                def in_bounds:
                  if .geometry.type == "Point" then
                    .geometry.coordinates[1] >= $minLat and .geometry.coordinates[1] <= $maxLat and
                    .geometry.coordinates[0] >= $minLon and .geometry.coordinates[0] <= $maxLon
                  elif .geometry.type == "LineString" then
                    (.geometry.coordinates | map(.[1] >= $minLat and .[1] <= $maxLat and .[0] >= $minLon and .[0] <= $maxLon) | any)
                  elif .geometry.type == "Polygon" then
                    (.geometry.coordinates[0] | map(.[1] >= $minLat and .[1] <= $maxLat and .[0] >= $minLon and .[0] <= $maxLon) | any)
                  elif .geometry.type == "MultiPolygon" then
                    (.geometry.coordinates[0][0] | map(.[1] >= $minLat and .[1] <= $maxLat and .[0] >= $minLon and .[0] <= $maxLon) | any)
                  else false end;
                { type: "FeatureCollection", features: [.features[] | select(in_bounds)] }
              ' raw/all.geojson > "raw/${filename}.geojson"
              
              # Compress
              gzip -9 -c "raw/${filename}.geojson" > "courses/$continent/$country/$state/${filename}.geojson.gz"
              rm "raw/${filename}.geojson"
              
              echo "  Created ${filename}.geojson.gz"
            done
            
            # Build state index
            jq -c --arg state "$state" --arg country "$country" --arg continent "$continent" '[.features[] | select(.properties.leisure == "golf_course" and .properties.name != null) | {
              name: .properties.name,
              city: (.properties["addr:city"] // ""),
              osmId: .id,
              file: ((.properties.name | ascii_downcase | gsub("[^a-z0-9]"; "-") | gsub("--+"; "-") | gsub("^-"; "") | gsub("-$"; "")) + "-" + .id + ".geojson.gz"),
              lat: (if .geometry.type == "Point" then .geometry.coordinates[1] 
                    elif .geometry.type == "LineString" then (.geometry.coordinates | map(.[1]) | add / length)
                    elif .geometry.type == "Polygon" then (.geometry.coordinates[0] | map(.[1]) | add / length)
                    elif .geometry.type == "MultiPolygon" then (.geometry.coordinates[0][0] | map(.[1]) | add / length)
                    else 0 end),
              lon: (if .geometry.type == "Point" then .geometry.coordinates[0]
                    elif .geometry.type == "LineString" then (.geometry.coordinates | map(.[0]) | add / length)
                    elif .geometry.type == "Polygon" then (.geometry.coordinates[0] | map(.[0]) | add / length)
                    elif .geometry.type == "MultiPolygon" then (.geometry.coordinates[0][0] | map(.[0]) | add / length)
                    else 0 end)
            }] | sort_by(.name)' raw/all.geojson > "courses/$continent/$country/$state/index.json"
            
            echo "  State index: $(jq length "courses/$continent/$country/$state/index.json") courses"
            
            # Cleanup
            rm -f raw/region.osm.pbf raw/golf.osm.pbf raw/all.geojson
            
          done < regions.txt

      - name: Build hierarchical indexes
        run: |
          # Country indexes
          for country_dir in courses/*/*/; do
            country=$(basename "$country_dir")
            parent=$(dirname "$country_dir")
            jq -s 'add | sort_by(.name)' "$country_dir"/*/index.json > "$country_dir/index.json" 2>/dev/null || echo "[]" > "$country_dir/index.json"
            echo "Country index $country: $(jq length "$country_dir/index.json") courses"
          done
          
          # Continent indexes
          for continent_dir in courses/*/; do
            continent=$(basename "$continent_dir")
            jq -s 'add | sort_by(.name)' "$continent_dir"/*/index.json > "$continent_dir/index.json" 2>/dev/null || echo "[]" > "$continent_dir/index.json"
            echo "Continent index $continent: $(jq length "$continent_dir/index.json") courses"
          done
          
          # Root index
          jq -s 'add | sort_by(.name)' courses/*/index.json > courses/index.json 2>/dev/null || echo "[]" > courses/index.json
          echo "Root index: $(jq length courses/index.json) courses"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add courses/
          git diff --staged --quiet || git commit -m "Update golf courses $(date +%Y-%m-%d)"
          git push
