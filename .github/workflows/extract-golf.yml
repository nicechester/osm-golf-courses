name: Extract Golf Courses

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y osmium-tool jq

      - name: Process all regions
        run: |
          TAG="v$(date +%Y%m%d)"
          
          # Create release if needed
          gh release view "$TAG" 2>/dev/null || gh release create "$TAG" \
            --title "Golf Courses $(date +%Y-%m-%d)" \
            --notes "Golf course GeoJSON files by region"
          
          regions=(
            us/alabama us/alaska us/arizona us/arkansas us/california
            us/colorado us/connecticut us/delaware us/district-of-columbia us/florida
            us/georgia us/hawaii us/idaho us/illinois us/indiana
            us/iowa us/kansas us/kentucky us/louisiana us/maine
            us/maryland us/massachusetts us/michigan us/minnesota us/mississippi
            us/missouri us/montana us/nebraska us/nevada us/new-hampshire
            us/new-jersey us/new-mexico us/new-york us/north-carolina us/north-dakota
            us/ohio us/oklahoma us/oregon us/pennsylvania us/puerto-rico
            us/rhode-island us/south-carolina us/south-dakota us/tennessee us/texas
            us/utah us/vermont us/virginia us/washington us/west-virginia
            us/wisconsin us/wyoming
            canada/alberta canada/british-columbia canada/manitoba canada/new-brunswick
            canada/newfoundland-and-labrador canada/northwest-territories canada/nova-scotia
            canada/nunavut canada/ontario canada/prince-edward-island canada/quebec
            canada/saskatchewan canada/yukon
            mexico
          )
          
          total=${#regions[@]}
          current=0
          
          for region in "${regions[@]}"; do
            current=$((current + 1))
            echo ""
            echo "=========================================="
            echo "[$current/$total] Processing: $region"
            echo "=========================================="
            
            # Determine paths
            if [[ "$region" == "mexico" ]]; then
              url="https://download.geofabrik.de/north-america/mexico-latest.osm.pbf"
              output_name="north-america_mx_mexico"
            elif [[ "$region" == us/* ]]; then
              state_slug="${region#us/}"
              url="https://download.geofabrik.de/north-america/us/${state_slug}-latest.osm.pbf"
              output_name="north-america_us_${state_slug}"
            elif [[ "$region" == canada/* ]]; then
              prov_slug="${region#canada/}"
              url="https://download.geofabrik.de/north-america/canada/${prov_slug}-latest.osm.pbf"
              output_name="north-america_ca_${prov_slug}"
            fi
            
            # Skip if already done
            if gh release view "$TAG" --json assets -q ".assets[].name" | grep -q "^${output_name}.geojson.gz$"; then
              echo "Already in release, skipping"
              continue
            fi
            
            # Download
            echo "Downloading $url..."
            for i in 1 2 3; do
              curl -L --retry 3 --retry-delay 5 -o region.osm.pbf "$url" && break
              echo "Retry $i..."
              sleep $((i * 5))
            done
            
            if [[ ! -f region.osm.pbf ]]; then
              echo "FAILED to download, skipping"
              continue
            fi
            
            echo "Downloaded: $(ls -lh region.osm.pbf | awk '{print $5}')"
            
            # Extract golf features
            osmium tags-filter region.osm.pbf \
              nwr/leisure=golf_course nwr/golf=hole nwr/golf=fairway nwr/golf=green nwr/golf=bunker nwr/golf=rough \
              -o golf.osm.pbf --overwrite
            
            osmium export golf.osm.pbf -o all.geojson --add-unique-id=type_id --overwrite
            
            # Count courses
            course_count=$(jq '[.features[] | select(.properties.leisure == "golf_course" and .properties.name != null)] | length' all.geojson)
            echo "Found $course_count courses"
            
            if [[ "$course_count" -gt 0 ]]; then
              # Compress and upload
              gzip -9 -c all.geojson > "${output_name}.geojson.gz"
              echo "Uploading ${output_name}.geojson.gz ($(ls -lh "${output_name}.geojson.gz" | awk '{print $5}'))..."
              gh release upload "$TAG" "${output_name}.geojson.gz" --clobber
              rm "${output_name}.geojson.gz"
            fi
            
            # Cleanup
            rm -f region.osm.pbf golf.osm.pbf all.geojson
            
            echo "Done: $region ($course_count courses)"
          done

      - name: Build and commit index
        run: |
          TAG="v$(date +%Y%m%d)"
          
          mkdir -p indexes
          
          # Download all geojson files and build index
          gh release download "$TAG" --pattern "*.geojson.gz" --dir tmp_data || true
          
          # Build master index
          echo "[" > indexes/index.json
          first=true
          
          for f in tmp_data/*.geojson.gz; do
            [[ -f "$f" ]] || continue
            name=$(basename "$f" .geojson.gz)
            
            # Extract course list from geojson
            gunzip -c "$f" | jq -c --arg file "${name}.geojson.gz" '.features[] | select(.properties.leisure == "golf_course" and .properties.name != null) | {
              name: .properties.name,
              city: (.properties["addr:city"] // ""),
              osmId: .id,
              file: $file,
              lat: (if .geometry.type == "Polygon" then (.geometry.coordinates[0] | map(.[1]) | add / length)
                    elif .geometry.type == "MultiPolygon" then (.geometry.coordinates | flatten(2) | map(.[1]) | add / length)
                    else null end),
              lon: (if .geometry.type == "Polygon" then (.geometry.coordinates[0] | map(.[0]) | add / length)
                    elif .geometry.type == "MultiPolygon" then (.geometry.coordinates | flatten(2) | map(.[0]) | add / length)
                    else null end)
            }' | while read -r entry; do
              if [[ "$first" == "true" ]]; then
                first=false
              else
                echo ","
              fi
              echo "$entry"
            done >> indexes/index.json
          done
          
          echo "]" >> indexes/index.json
          
          # Sort and clean up index
          jq -s 'add | sort_by(.name)' indexes/index.json > indexes/index_sorted.json
          mv indexes/index_sorted.json indexes/index.json
          
          echo "Total courses: $(jq length indexes/index.json)"
          
          # Commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indexes/
          git diff --staged --quiet || git commit -m "Update index $(date +%Y-%m-%d)"
          git push
