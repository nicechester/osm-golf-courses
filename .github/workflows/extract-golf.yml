name: Extract Golf Courses

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y osmium-tool jq

      - name: Extract golf courses
        id: extract
        run: |
          chmod +x ./scripts/extract.sh
          ./scripts/extract.sh output && echo "failed=0" >> $GITHUB_OUTPUT || echo "failed=1" >> $GITHUB_OUTPUT

      - name: Create release and upload
        id: release
        run: |
          TAG="v$(date +%Y%m%d)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          # Create pre-release
          gh release view "$TAG" 2>/dev/null || gh release create "$TAG" \
            --title "Golf Courses $(date +%Y-%m-%d)" \
            --notes "Golf course GeoJSON files by region" \
            --prerelease
          
          # Upload all files
          for f in output/*.geojson.gz; do
            [[ -f "$f" ]] || continue
            echo "Uploading $(basename "$f")..."
            gh release upload "$TAG" "$f" --clobber
          done

      - name: Build and commit index
        if: steps.extract.outputs.failed == '0'
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          
          echo '[]' > indexes/index_new.json
          for f in output/*.geojson.gz; do
            [[ -f "$f" ]] || continue
            name=$(basename "$f" .geojson.gz)
            echo "Indexing $name..."
            gunzip -c "$f" | jq -c --arg file "${name}.geojson.gz" '[.features[] | select(.properties.leisure == "golf_course" and .properties.name != null) | {
              name: .properties.name,
              city: (.properties["addr:city"] // ""),
              osmId: .id,
              file: $file,
              lat: (if .geometry.type == "Polygon" then (.geometry.coordinates[0] | map(.[1]) | add / length)
                    elif .geometry.type == "MultiPolygon" then (.geometry.coordinates | flatten(2) | map(.[1]) | add / length)
                    else null end),
              lon: (if .geometry.type == "Polygon" then (.geometry.coordinates[0] | map(.[0]) | add / length)
                    elif .geometry.type == "MultiPolygon" then (.geometry.coordinates | flatten(2) | map(.[0]) | add / length)
                    else null end)
            }]' > tmp_region.json
            jq -s 'add' indexes/index_new.json tmp_region.json > indexes/index_tmp.json
            mv indexes/index_tmp.json indexes/index_new.json
          done
          
          jq '[.[] | select(.lat != null and .lon != null)] | sort_by(.name)' indexes/index_new.json > indexes/index_final.json
          
          new_count=$(jq length indexes/index_final.json)
          old_count=$(jq length indexes/index.json 2>/dev/null || echo 0)
          echo "New index: $new_count entries (was: $old_count)"
          
          # Sanity checks
          if [[ "$old_count" -gt 0 && "$new_count" -lt $((old_count / 2)) ]]; then
            echo "ERROR: Index dropped >50%"
            exit 1
          fi
          if [[ "$new_count" -lt 10000 ]]; then
            echo "ERROR: Index too small ($new_count < 10000)"
            exit 1
          fi
          
          mv indexes/index_final.json indexes/index.json
          rm -f indexes/index_new.json tmp_region.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indexes/
          git diff --staged --quiet || git commit -m "Update index $(date +%Y-%m-%d)"
          git push

      - name: Promote release
        if: steps.extract.outputs.failed == '0'
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          echo "Promoting release to production"
          gh release edit "$TAG" --prerelease=false

      - name: Report failure
        if: steps.extract.outputs.failed != '0'
        run: |
          gh issue create \
            --title "Extract failed $(date +%Y-%m-%d)" \
            --body "Some regions failed to download. Release remains pre-release. Index not updated.

[View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "bug"
